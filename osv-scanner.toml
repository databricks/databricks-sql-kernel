# OSV-Scanner suppression config for databricks-sql-kernel.
#
# Each [[IgnoredVulns]] entry suppresses a CVE/GHSA ID GLOBALLY across
# all packages (osv-scanner v2.3.8 doesn't support per-package CVE
# scoping). Every entry MUST carry a justification comment explaining
# why the vulnerability doesn't apply to our usage, and a TODO or
# expiry note if the suppression is provisional.
#
# Example:
#
# [[IgnoredVulns]]
# id = "CVE-2024-XXXXX"
# # Justification: <how the vuln does not apply to kernel use, e.g.,
# # "kernel does not parse untrusted YAML" or "kernel does not expose
# # the affected entrypoint">
# # Expiry: 2026-12-31 (if provisional)
#
# TODO(securityScan): the `# Expiry:` convention above is documentation
# only — no workflow step rejects expired suppressions today. Add an
# expiry-lint step to securityScan.yml (PR + cron) that parses these
# comments, fails the run if any `Expiry: <date>` is in the past, and
# emits a step-summary table of upcoming-expiry entries. Tracked
# separately so this file stays empty on the initial landing; once we
# have real suppressions to enforce against, wire it up.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0176"
# pyo3 0.24.0..=0.28.x: out-of-bounds read in
# Bound{List,Tuple}Iterator::nth / nth_back (unchecked usize add/sub
# before the bounds check). Fixed in pyo3 0.29.0.
# Justification: the pyo3 sub-crate never iterates a Python list or
# tuple via pyo3's Bound iterators, and never calls nth / nth_back on
# one. All `.iter()` / `.into_iter()` / `.nth()` uses in pyo3/src are
# over Rust std collections (Vec / slice), which are unaffected. We
# cannot bump to the fixed 0.29 yet because arrow-pyarrow (through
# arrow 59) still caps pyo3 at ^0.28.
# Expiry: 2026-10-01 (revisit once arrow-pyarrow supports pyo3 0.29)

[[IgnoredVulns]]
id = "RUSTSEC-2026-0177"
# pyo3 <=0.28.x: PyCFunction::new_closure accepted closures that were
# Send + 'static but not Sync, allowing concurrent invocation of a
# non-Sync closure (data race, notably under free-threaded Python).
# Fixed in pyo3 0.29.0.
# Justification: this crate does not call PyCFunction::new_closure (or
# new_closure_bound) anywhere — we expose #[pyclass] / #[pymethods]
# types, not dynamically-built C closures. Same 0.29 upgrade blocker
# as RUSTSEC-2026-0176 (arrow-pyarrow caps pyo3 at ^0.28).
# Expiry: 2026-10-01 (revisit once arrow-pyarrow supports pyo3 0.29)
