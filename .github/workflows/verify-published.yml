# Post-publish verification of the released artifacts.
#
# Installs the PUBLISHED package (PyPI wheel for python, npm package for
# nodejs) on each available OS/arch runner and runs a smoke check:
# import/load the native binding and assert its version == the released
# version. This catches wrong-arch binaries, missing platform packages,
# load failures, and version mismatches that the release-repo build/scan
# cannot — because they only run AFTER the artifacts are live.
#
# Triggered automatically from databricks/secure-public-registry-releases-eng
# via repository_dispatch (event type `verify-published`) at the end of a
# successful publish, and manually via workflow_dispatch.
#
# ------------------------------------------------------------------
# Runner coverage caveat (READ THIS)
# ------------------------------------------------------------------
# A real install-test must run on the actual target arch — you cannot
# import an x86_64 wheel on an arm64 runner. This org only provides
# runners for THREE of the nine published arches:
#
#   - linux x64 gnu  → databricks-protected-runner-group / linux-ubuntu-latest
#   - macOS arm64    → macos-14 (GitHub-hosted)
#   - windows x64    → databricks-protected-runner-group / windows-server-latest
#
# The other six (linux arm64 gnu/musl, linux x64 musl, macOS x64,
# windows arm64) have NO available runner, so they are NOT install-tested
# here. The `coverage-note` job logs them explicitly so the gap is
# visible rather than silently assumed-covered.

name: verify-published

on:
  repository_dispatch:
    types: [verify-published]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to verify (e.g. 0.1.2)."
        required: true
      which:
        description: "Which ecosystem(s) to verify."
        required: true
        type: choice
        default: both
        options:
          - both
          - python
          - nodejs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.version || inputs.version }}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  # repository_dispatch carries the version in client_payload; manual
  # runs use the input. One of the two is always set.
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  WHICH: ${{ github.event.client_payload.which || inputs.which || 'both' }}

jobs:
  python:
    name: "verify python wheel (${{ matrix.label }})"
    if: ${{ (github.event.client_payload.which || inputs.which || 'both') != 'nodejs' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner:
              group: databricks-protected-runner-group
              labels: linux-ubuntu-latest
          - label: macos-arm64
            runner: macos-14
          - label: windows-x64
            runner:
              group: databricks-protected-runner-group
              labels: windows-server-latest
    steps:
      # uv (allow-listed static binary) — installs and runs python
      # uniformly across all three runner types, including the
      # self-hosted ones, without a glibc-bound interpreter.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install published wheel + import-and-version check
        env:
          PKG_VERSION: ${{ env.VERSION }}
        run: |
          echo "Verifying databricks-sql-kernel==${PKG_VERSION} on ${{ matrix.label }}"
          # Isolated venv; install ONLY the published wheel (no source,
          # no build) so we exercise the real artifact.
          uv venv /tmp/verify
          # Retry with backoff: a just-published version is not visible
          # immediately — the registry CDN lags and, more so, the JFrog
          # remote-repo proxy caches upstream metadata for its TTL, so
          # the new version can 404 through the proxy for a while. Poll
          # the install until it resolves (up to ~15 min).
          attempt=0; max=30
          until uv pip install --python /tmp/verify "databricks-sql-kernel==${PKG_VERSION}"; do
            attempt=$((attempt+1))
            if [[ $attempt -ge $max ]]; then
              echo "::error::databricks-sql-kernel==${PKG_VERSION} not installable after ${max} attempts (~15m) — registry/proxy propagation or a missing wheel for this arch."
              exit 1
            fi
            echo "Not available yet (attempt ${attempt}/${max}); retrying in 30s..."
            sleep 30
          done
          uv run --python /tmp/verify python - <<'PY'
          import os, importlib.metadata as md
          import databricks_sql_kernel  # native import — fails if the wheel's binary can't load
          want = os.environ["PKG_VERSION"]
          got = md.version("databricks-sql-kernel")
          print(f"imported databricks_sql_kernel OK; metadata version={got}")
          assert got == want, f"version mismatch: installed {got}, expected {want}"
          print("OK")
          PY

  nodejs:
    name: "verify npm package (${{ matrix.label }})"
    if: ${{ (github.event.client_payload.which || inputs.which || 'both') != 'python' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner:
              group: databricks-protected-runner-group
              labels: linux-ubuntu-latest
          - label: macos-arm64
            runner: macos-14
          - label: windows-x64
            runner:
              group: databricks-protected-runner-group
              labels: windows-server-latest
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "22"

      - name: Install published package + require-and-version check
        env:
          PKG_VERSION: ${{ env.VERSION }}
        run: |
          echo "Verifying @databricks/databricks-sql-kernel@${PKG_VERSION} on ${{ matrix.label }}"
          # Fresh dir; install ONLY the published umbrella package. npm
          # resolves the matching platform optionalDependency for this
          # arch and the umbrella loader require()s it.
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          # Retry with backoff: the just-published version isn't visible
          # immediately through the JFrog npm proxy (remote-repo metadata
          # cache TTL) or the registry CDN. Poll until it resolves
          # (up to ~15 min).
          attempt=0; max=30
          until npm install "@databricks/databricks-sql-kernel@${PKG_VERSION}"; do
            attempt=$((attempt+1))
            if [[ $attempt -ge $max ]]; then
              echo "::error::@databricks/databricks-sql-kernel@${PKG_VERSION} not installable after ${max} attempts (~15m) — registry/proxy propagation or a missing platform package for this arch."
              exit 1
            fi
            echo "Not available yet (attempt ${attempt}/${max}); retrying in 30s..."
            sleep 30
          done
          node - <<'JS'
          const k = require('@databricks/databricks-sql-kernel'); // native load — fails if platform pkg missing/wrong arch
          const got = require('@databricks/databricks-sql-kernel/package.json').version;
          const want = process.env.PKG_VERSION;
          console.log(`required @databricks/databricks-sql-kernel OK; version=${got}`);
          if (got !== want) { console.error(`version mismatch: installed ${got}, expected ${want}`); process.exit(1); }
          console.log('OK');
          JS

  coverage-note:
    name: "coverage gaps (arches without runners)"
    if: ${{ always() }}
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Log un-verified arches
        run: |
          cat <<'NOTE'
          ::warning::Six published arches are NOT install-verified — no runner available:
            python wheels:  linux aarch64 (gnu+musl), linux x86_64 musl, macOS x86_64, windows aarch64
            npm packages:   linux-arm64-gnu, linux-arm64-musl, linux-x64-musl, darwin-x64, win32-arm64-msvc
          Only linux-x64-gnu, macOS-arm64, and windows-x64 are install-tested
          (the arches this org has runners for). If/when arm64-Linux or
          x86_64-macOS runners become available, add them to the matrices above.
          NOTE
