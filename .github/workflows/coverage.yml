# Code coverage report. Runs `cargo llvm-cov` against the unit /
# integration test suite (E2E tests stay #[ignore]'d) and uploads
# the lcov result to Codecov via OIDC.

name: Coverage

on:
  push:
    branches: [main]
    # Path-filtered: a full instrumented rebuild (`cargo llvm-cov`) is
    # expensive, so only run it when something that can move the
    # coverage number changes. Docs / workflow-only PRs skip it.
    paths:
      - "src/**"
      - "tests/**"
      - "adbc/**"
      - "pyo3/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "adbc/**"
      - "pyo3/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # E2E tests stay #[ignore]'d; coverage runs the same suite
        # as `pr-checks.yml`'s `test` job.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --manifest-path adbc/Cargo.toml --features ffi --lcov --output-path adbc-lcov.info

      - name: Store coverage reports for trusted upload
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            lcov.info
            adbc-lcov.info
          if-no-files-found: error
          retention-days: 1

      # Fork PRs cannot receive OIDC permissions. Keep their advisory coverage
      # upload in the unprivileged build job instead.
      - name: Upload fork coverage anonymously
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info,adbc-lcov.info
          fail_ci_if_error: false

  upload:
    name: Upload coverage to Codecov
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports

      # This job only handles generated reports, so contributor-controlled
      # build scripts cannot access its OIDC mint permission.
      - name: Upload to Codecov with OIDC
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info,adbc-lcov.info
          fail_ci_if_error: false
          use_oidc: true
