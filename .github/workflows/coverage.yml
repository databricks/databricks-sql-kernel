# Code coverage report. Runs `cargo llvm-cov` against the unit /
# integration test suite (E2E tests stay #[ignore]'d) and uploads
# the lcov result as a workflow artifact for local inspection.
#
# The previous draft uploaded to Codecov via `use_oidc: true`, but
# that requires the repo to be enrolled in Codecov's GitHub App
# with OIDC enabled — not yet verified. Pairing unverified
# enrollment with `fail_ci_if_error: false` silently masks dropped
# uploads, so the Codecov step is removed until enrollment is
# confirmed and we can opt back in with `fail_ci_if_error: true`.

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e0eafa9a0d485c37f97c0f7beb930a58a2facbac  # v2.79.4
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # E2E tests stay #[ignore]'d; coverage runs the same suite
        # as `pr-checks.yml`'s `test` job.
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
