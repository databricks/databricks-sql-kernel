name: Release Debuginfo

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hosted macOS runners cannot check out this private repository through the
  # org IP allow list. Hand the same checked-out source to macOS through the
  # Actions artifact service, which is not allow-list gated.
  macos-source:
    name: Source handoff (macOS)
    runs-on:
      group: databricks-protected-runner-group
      labels: [linux-ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo-src

      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          tar czf repo-source.tar.gz -C repo-src --exclude='.git' .

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-debuginfo-source
          path: repo-source.tar.gz
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux split DWARF
    runs-on:
      group: databricks-protected-runner-group
      labels: [linux-ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Verify split DWARF
        shell: bash
        run: bash .github/scripts/check-release-debuginfo.sh

  macos:
    name: macOS dSYM
    needs: macos-source
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-debuginfo-source

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          tar xzf repo-source.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f repo-source.tar.gz
          test -f Cargo.toml

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Verify dSYM
        shell: bash
        run: bash .github/scripts/check-release-debuginfo.sh

  windows:
    name: Windows linker PDB
    runs-on:
      group: databricks-protected-runner-group
      labels: [windows-server-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Volume file and cancellation tests
        shell: pwsh
        run: cargo test --locked --lib volume::tests

      - name: Verify linker PDB
        shell: pwsh
        run: ./.github/scripts/check-release-debuginfo.ps1
