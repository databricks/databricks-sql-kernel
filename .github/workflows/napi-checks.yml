# napi-rs sub-crate CI. The napi/ directory is a *standalone* Cargo
# workspace (see napi/Cargo.toml — `[workspace] members = ["."]`)
# because it pins `tls-rustls` on the kernel while the root workspace
# picks `tls-native` via pyo3. Feature-unification under a single
# workspace would link both TLS stacks into the resulting cdylib.
#
# Consequence: every cargo invocation here runs from `napi/`, not the
# repo root. Lockfile drift detection uses `--locked` against
# `napi/Cargo.lock` rather than the kernel's root lock.
#
# Path-gated on `napi/**` so this workflow fires only when the
# directory or its inputs change.

name: napi Checks

on:
  push:
    branches: [main]
    paths:
      - "napi/**"
      - "src/**"
      # Root Cargo.toml change can affect napi via its `path = ".."`
      # kernel dep, so this workflow re-runs to catch mismatches.
      - "Cargo.toml"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/napi-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "napi/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/napi-checks.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-and-test:
    name: "napi fmt + clippy + test"
    permissions:
      contents: read
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        # All cargo commands run from the napi/ standalone workspace.
        working-directory: napi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Route cargo through the unauthenticated filtered proxy so fork PRs
      # never receive an OIDC mint permission while executing
      # contributor-controlled code.
      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          # napi is a standalone workspace; cache its actual target and
          # lockfile instead of the unused repository-root target.
          cache-workspaces: "napi -> target"

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # `--locked` makes the build fail if `napi/Cargo.lock` is out of
      # sync with `napi/Cargo.toml` — catches contributors who bump a
      # dep version in Cargo.toml without re-running `cargo update`.
      # Mirrors the dual-Cargo.lock-drift concern from review.
      - name: cargo clippy --all-targets --locked -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test --locked
        # The napi crate's Rust-side unit tests (error envelope, panic
        # guard, runtime handle, version) run here. No network, no
        # secrets — purely cdylib + rlib in-tree tests.
        #
        # `--features dyn-symbols`: napi-rs 3 references N-API symbols
        # from a `Drop` impl unconditionally, so the hostless `lib test`
        # executable can't link/run without them. dyn-symbols resolves
        # N-API via libloading with no-op stubs when absent, letting the
        # pure-logic tests run with no Node host. The release cdylib
        # (built below) intentionally omits it and keeps link-time symbols.
        run: cargo test --locked --features dyn-symbols

      # Drift guard for the committed loader (napi/index.js +
      # napi/index.d.ts). PR #146 review feedback: nothing in CI
      # detects when a contributor adds a top-level `#[napi]` symbol
      # without recommitting the generated loader, and that already
      # happened once (3 logger exports went missing in #146 before
      # this check landed).
      #
      # This is a SURFACE audit, not a full regenerate-and-diff —
      # parses napi/src/**.rs for top-level `#[napi]` items and
      # compares against the destructured names in napi/index.js.
      # Catches the "new export missing" bug class without needing
      # an npm proxy on the protected runner (which doesn't yet
      # exist; see .github/actions/setup-jfrog/action.yml — npm
      # support is a "future" item). When npm-via-JFrog lands, this
      # step should be replaced with the full reviewer-preferred
      # form: `npx --yes @napi-rs/cli@2.18.4 build --platform ...`
      # then `git diff --exit-code -- napi/index.js napi/index.d.ts`.
      # Tracked in the PR #146 discussion.
      - name: Check napi loader is in sync with #[napi] surface
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check-napi-loader-drift.sh

      # Release-profile build verifies the cdylib actually links with
      # the production profile knobs (lto=true, codegen-units=1,
      # strip="debuginfo"). The lto=true link is the slow part (~4 min
      # here), and `cargo check --release` would NOT exercise it
      # (check doesn't link the cdylib), so we keep the real build but
      # run it only on push to main — a post-merge canary — rather
      # than on every PR push. napi is not a required check, so this
      # keeps PR feedback fast (fmt + clippy + test, ~2.5 min) while
      # still catching release-only link regressions before they
      # accumulate on main. The merge group does not run napi (no
      # merge_group trigger), so main is the gate.
      - name: cargo build --release --locked
        if: github.event_name == 'push'
        run: cargo build --release --locked
