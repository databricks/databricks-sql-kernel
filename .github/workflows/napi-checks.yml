# napi-rs sub-crate CI. The napi/ directory is a *standalone* Cargo
# workspace (see napi/Cargo.toml — `[workspace] members = ["."]`)
# because it pins `tls-rustls` on the kernel while the root workspace
# picks `tls-native` via pyo3. Feature-unification under a single
# workspace would link both TLS stacks into the resulting cdylib.
#
# Consequence: every cargo invocation here runs from `napi/`, not the
# repo root. Lockfile drift detection uses `--locked` against
# `napi/Cargo.lock` rather than the kernel's root lock.
#
# Path-gated on `napi/**` so this workflow fires only when the
# directory or its inputs change.

name: napi Checks

on:
  push:
    branches: [main]
    paths:
      - "napi/**"
      # Root Cargo.toml change can affect napi via its `path = ".."`
      # kernel dep, so this workflow re-runs to catch mismatches.
      - "Cargo.toml"
      - ".github/workflows/napi-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "napi/**"
      - "Cargo.toml"
      - ".github/workflows/napi-checks.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
# `id-token: write` is NOT granted workflow-wide: the `precondition`
# job only checks out and inspects the tree, so least-privilege keeps
# it on the single job that needs it (`check-and-test`, below).

defaults:
  run:
    shell: bash

jobs:
  # Cheap gate job — runs once, no toolchain installs. The check-and-test
  # job depends on this and is skipped (no runner boot beyond the
  # precondition runner itself) when the napi/ sub-crate doesn't
  # exist. Avoids wasted setup cost on kernel-only PRs that trigger
  # this workflow via root Cargo.toml changes before the napi crate
  # has merged.
  precondition:
    name: "Check napi sub-crate exists"
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: "Check for napi/Cargo.toml"
        id: check
        run: |
          if [[ -f "napi/Cargo.toml" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::napi/ sub-crate does not exist yet — skipping napi checks. (Workflow may fire on root Cargo.toml changes before the napi crate has merged.)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  check-and-test:
    name: "napi fmt + clippy + test"
    needs: precondition
    if: needs.precondition.outputs.ready == 'true'
    # Scoped here (not workflow-wide): `id-token: write` is only needed
    # for the OIDC token exchange in `.github/actions/setup-jfrog` that
    # authenticates against the JFrog cargo proxy. See go/hardened-gha.
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        # All cargo commands run from the napi/ standalone workspace.
        working-directory: napi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Route cargo through the JFrog crates proxy. The protected
      # runner group blocks direct crates.io, so without this every
      # cargo command below fails to update the registry index. The
      # composite writes ~/.cargo/config.toml (a source replacement),
      # which preserves resolved versions, so `--locked` stays valid.
      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # `--locked` makes the build fail if `napi/Cargo.lock` is out of
      # sync with `napi/Cargo.toml` — catches contributors who bump a
      # dep version in Cargo.toml without re-running `cargo update`.
      # Mirrors the dual-Cargo.lock-drift concern from review.
      - name: cargo clippy --all-targets --locked -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test --locked
        # The napi crate's Rust-side unit tests (error envelope, panic
        # guard, runtime handle, version) run here. No network, no
        # secrets — purely cdylib + rlib in-tree tests.
        run: cargo test --locked

      # Release-profile build verifies the cdylib actually links with
      # the production profile knobs (lto=true, codegen-units=1,
      # strip="debuginfo"). The lto=true link is the slow part (~4 min
      # here), and `cargo check --release` would NOT exercise it
      # (check doesn't link the cdylib), so we keep the real build but
      # run it only on push to main — a post-merge canary — rather
      # than on every PR push. napi is not a required check, so this
      # keeps PR feedback fast (fmt + clippy + test, ~2.5 min) while
      # still catching release-only link regressions before they
      # accumulate on main. The merge group does not run napi (no
      # merge_group trigger), so main is the gate.
      - name: cargo build --release --locked
        if: github.event_name == 'push'
        run: cargo build --release --locked
