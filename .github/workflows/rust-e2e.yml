# End-to-end tests against a live Databricks workspace.
#
# Single `e2e` job covers the v0 surface (Session::open, execute,
# submit, await_result, metadata) via PAT + OAuth M2M. OAuth U2M is
# intentionally absent: it requires a browser flow that can't run in
# CI; `tests/oauth_u2m_integration.rs` covers it on developer
# machines.
#
# Proxy + TLS coverage will land alongside the v0.1 work that fleshes
# out `ProxyConfig` / `TlsConfig` in `src/config.rs` and plumbs them
# through `src/client/http.rs`. Tracked in `docs/migration-plan.md`
# §7.

name: Rust E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-e2e.yml"

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-rust-e2e
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: "v0 E2E surface"
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    environment: azure-prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.TEST_PECO_WAREHOUSE_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_TEST_CLIENT_ID: ${{ secrets.DATABRICKS_TEST_CLIENT_ID }}
      DATABRICKS_TEST_CLIENT_SECRET: ${{ secrets.DATABRICKS_TEST_CLIENT_SECRET }}
      RUST_LOG: databricks_sql_kernel=debug
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1

      - name: Run v0 E2E tests
        run: |
          for suite in v0_session_e2e v0_execute_e2e v0_async_execute_e2e v0_metadata_e2e; do
            echo "::group::cargo test --test ${suite}"
            cargo test --test "${suite}" -- --ignored --nocapture
            echo "::endgroup::"
          done
