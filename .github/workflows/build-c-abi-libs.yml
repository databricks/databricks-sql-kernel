# Builds the C-ABI static library (libdatabricks_sql_kernel.a) for every
# supported OS/arch on a NATIVE runner, checksums each one, and publishes them as
# workflow artifacts + release assets.
#
# This is the producer for the per-platform Go bindings distributed by
# github.com/databricks/databricks-sql-kernel-bindings — that repo holds one
# nested Go module per platform (lib/<os>_<arch>/libdatabricks_sql_kernel.a), and
# the Go driver (databricks-sql-go) requires the matching module so a kernel
# opt-in `go get` build links a prebuilt archive with no Rust toolchain and no
# `make kernel-lib` step.
#
# ARTIFACT-ONLY (no automated push): this workflow only BUILDS + uploads the
# archives (as CI artifacts and, on a tag, GitHub release assets). It does NOT
# push into any other repo. Getting the archives into the bindings repo is a
# separate, deliberate step (download the artifacts/assets and commit them into
# lib/<platform>/), done by a maintainer — not automated here. Each artifact is
# named `kernel-c-abi-<platform>` and contains `libdatabricks_sql_kernel.a` (or
# `databricks_sql_kernel.lib` on Windows), its `.sha256`, and the C header.
#
# Why native runners (not cross-compilation): `cargo build` here uses the host
# target (no `--target`), matching how the kernel is built and tested elsewhere.
# Each archive is produced on its real OS/arch so the emitted machine code, the
# system C++ runtime it expects, and the object-file format are all correct —
# cross-toolchains are error-prone for a Rust staticlib with C++ transitive deps
# (BoringSSL etc.). One job per platform, one archive out.
#
# Triggered by:
#   1. Pushing a `v*` git tag — the canonical release path (same trigger as
#      cargo-publish.yml, so a kernel release produces both the crate and the
#      C-ABI archives in lockstep).
#   2. Manual `workflow_dispatch` — for ad-hoc archive builds / re-runs.
#
# Build flags mirror the Go driver's build/kernel-lib.sh source build exactly:
#   cargo build --release --locked --no-default-features --features tls-rustls
# so the CI-produced archive is byte-for-byte the same shape the driver expects
# (pure-Rust TLS, no default features).

name: Build C-ABI Libraries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Attach archives to the GitHub release for the triggering tag"
        required: false
        default: "false"

concurrency:
  # One archive-build run per ref; a newer push supersedes an in-flight build.
  group: ${{ github.repository }}-build-c-abi-libs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # OIDC token exchange for the .github/actions/setup-jfrog composite (cargo
  # dependency proxy). See go/hardened-gha.
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "C-ABI ${{ matrix.platform }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is the Go GOOS_GOARCH tag the driver's nested modules key
          # off (internal/backend/kernel/kernellib/<platform>). `runs-on` picks a
          # NATIVE runner for that OS/arch so no cross-toolchain is involved.
          - platform: darwin_arm64
            runs-on: macos-14          # Apple Silicon
            archive: libdatabricks_sql_kernel.a
          - platform: darwin_amd64
            runs-on: macos-13          # Intel
            archive: libdatabricks_sql_kernel.a
          - platform: linux_amd64
            runs-on: ubuntu-latest
            archive: libdatabricks_sql_kernel.a
          - platform: linux_arm64
            runs-on: ubuntu-24.04-arm  # native ARM runner (no cross)
            archive: libdatabricks_sql_kernel.a
          - platform: windows_amd64
            runs-on: windows-latest
            archive: databricks_sql_kernel.lib  # MSVC toolchain names it .lib
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Configure JFrog Artifactory access (cargo proxy)
        uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # Build the staticlib with the SAME flags as the Go driver's
      # build/kernel-lib.sh source build. No `--target`: host-native build on a
      # matching native runner. The root Cargo.toml already declares
      # crate-type = ["lib", "cdylib", "staticlib"], so `staticlib` emits the .a
      # (or .lib on MSVC) under target/release/.
      - name: Build C-ABI static library
        run: |
          cargo build --release --locked --no-default-features --features tls-rustls

      # macOS only: the archive itself has no install_name (that is a dylib
      # concept), so nothing to rewrite for the STATIC lib. This step is a
      # placeholder marker documenting that the static path needs no
      # relocatability fix-up — unlike the dynamic .dylib path, which would need
      # `install_name_tool -id @rpath/...`. Kept as an explicit no-op so a future
      # dynamic variant has an obvious home.
      - name: (static) no install_name fix-up needed
        if: startsWith(matrix.platform, 'darwin')
        run: echo "static .a carries no install_name; nothing to relocate"

      # Stage the produced archive under a per-platform directory that mirrors
      # the driver's nested-module layout, plus a SHA-256 the driver verifies
      # before committing/using it.
      - name: Stage archive + checksum
        run: |
          set -euo pipefail
          OUT="dist/${{ matrix.platform }}"
          mkdir -p "$OUT"
          SRC="target/release/${{ matrix.archive }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::expected archive not found at $SRC"
            ls -la target/release/ || true
            exit 1
          fi
          cp "$SRC" "$OUT/${{ matrix.archive }}"
          # Also emit the C header alongside so the driver can commit a matching
          # header at the same revision. The header is generated into include/.
          if [ -f include/databricks_kernel.h ]; then
            cp include/databricks_kernel.h "$OUT/databricks_kernel.h"
          fi
          # Portable SHA-256 (shasum on macOS, sha256sum on Linux; certutil Win).
          cd "$OUT"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            certutil -hashfile "${{ matrix.archive }}" SHA256 | sed -n 2p > "${{ matrix.archive }}.sha256"
          fi
          echo "staged:"; ls -la
          echo "size: $(wc -c < "${{ matrix.archive }}") bytes"

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-c-abi-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

      # On a tag build (or when explicitly requested), attach the archive to the
      # GitHub release for that tag, so the Go driver's sync workflow can pull a
      # signed, immutable asset by tag rather than a transient CI artifact.
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd "dist/${{ matrix.platform }}"
          # Namespace the asset by platform so all five archives coexist on one
          # release without name clashes.
          ASSET="libdatabricks_sql_kernel-${{ matrix.platform }}.a"
          cp "${{ matrix.archive }}" "$ASSET"
          gh release upload "$TAG" \
            "$ASSET" "${{ matrix.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
