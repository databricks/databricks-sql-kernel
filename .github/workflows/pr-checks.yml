# Per-PR build / format / lint / unit-test gate. Runs on every PR
# against `main` and on every push to `main`. Mirrors the
# `code-quality-checks` workflow in databricks/databricks-sql-python
# and the `prCheck` workflow in databricks/databricks-jdbc.

name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the OIDC token exchange that the
  # `.github/actions/setup-jfrog` composite uses to authenticate
  # against the JFrog cargo proxy. See go/hardened-gha.
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Formatting
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo +stable fmt --all -- --check

  clippy:
    name: Clippy
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          toolchain: stable
          components: clippy

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit + doc tests
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          toolchain: stable

      - name: cargo test
        # Runs every test the default suite executes: unit tests,
        # doc tests, and wiremock-backed integration tests. Does NOT
        # run the v0_*_e2e suites — those are #[ignore]'d and require
        # a live workspace; `rust-e2e.yml` runs them separately.
        run: cargo test --workspace
