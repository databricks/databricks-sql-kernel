# Per-PR build / format / lint / unit-test gate. Runs on every PR
# against `main` and on every push to `main`. Mirrors the
# `code-quality-checks` workflow in databricks/databricks-sql-python
# and the `prCheck` workflow in databricks/databricks-jdbc.

name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  # The `protect-main` ruleset enables a merge queue and lists this
  # workflow's "Unit + doc tests" job as a required status check.
  # GitHub re-evaluates required checks against the merge-group ref,
  # so without this trigger the queue entry hangs until
  # `check_response_timeout_minutes` expires. The sibling jobs
  # (Formatting / Clippy / Build (tls-rustls feature)) also run on the
  # merge group — they are advisory, not required, so the extra runs
  # are harmless and keep the workflow trigger simple.
  merge_group:

concurrency:
  # pull_request: coalesce per head_ref (PR branch).
  # merge_group: head_ref is empty, so fall back to github.ref (the
  #   unique gh-readonly-queue ref) — distinct queue entries stay
  #   separate.
  # push to main: head_ref is also empty, but falling back to
  #   github.ref ("refs/heads/main") would make cancel-in-progress
  #   cancel the previous main push's in-flight CI. Pin to github.sha
  #   on push so each landed commit keeps its own isolated run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Formatting
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test install-log URL redaction
        run: bash .github/actions/install-bot-engine/redact-command-output_test.sh

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable fmt --manifest-path adbc/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit + doc tests
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: cargo test
        # Runs every test the default suite executes: unit tests,
        # doc tests, and wiremock-backed integration tests. Does NOT
        # run the v0_*_e2e suites — those are #[ignore]'d and require
        # a live workspace; `rust-e2e.yml` runs them separately.
        run: cargo test --workspace

  volume-windows:
    name: Volume tests (Windows)
    runs-on:
      group: databricks-protected-runner-group
      labels: [windows-server-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Volume file and cancellation tests
        shell: pwsh
        run: cargo test --locked --lib volume::tests

  c-abi:
    name: C ABI smoke test
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: make c-abi-test
        # Builds the cdylib and compiles + runs the hand-written C smoke
        # tests in tests/c/ against the C ABI exported from src/c_abi/.
        # Hermetic (no live warehouse) — proves ODBC / Go consumers can
        # link and call the kernel. `cc` is preinstalled on the runner.
        run: make c-abi-test

  adbc:
    name: ADBC native + C ABI
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.89.0
          components: clippy

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Test native Rust and ADBC C ABI surfaces
        working-directory: adbc
        run: |
          cargo clippy --all-targets --features ffi -- -D warnings
          cargo test --features ffi

      - name: Build and dynamically load the ADBC driver
        working-directory: adbc
        run: |
          cargo build --release --features ffi --lib --example ffi_smoke
          ./target/release/examples/ffi_smoke "$PWD/target/release/libdatabricks_adbc.so"

      - name: Verify package contents
        working-directory: adbc
        run: cargo package --allow-dirty --list

  check-tls-rustls:
    name: Build (tls-rustls feature)
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: cargo check (tls-rustls)
        # Default features pull in `tls-native`; the napi binding crate
        # opts INTO `tls-rustls` instead. Without this job, a feature-
        # gated cfg typo or a dep update that breaks rustls compilation
        # would only surface when the downstream napi build breaks.
        run: cargo check -p databricks-sql-kernel --no-default-features --features tls-rustls

      - name: cargo clippy (tls-rustls)
        # Keep clippy honest under both backends so warnings caught
        # under tls-native don't disappear under tls-rustls and vice
        # versa.
        run: cargo clippy -p databricks-sql-kernel --no-default-features --features tls-rustls --all-targets -- -D warnings

      - name: Test client behavior (tls-rustls)
        run: "cargo test -p databricks-sql-kernel --no-default-features --features tls-rustls --lib client::"
