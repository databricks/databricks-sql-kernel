# PyO3 sub-crate CI. Path-gated so the matrix runs only when the
# binding or one of its root Cargo inputs changes.

name: PyO3 Checks

on:
  push:
    branches: [main]
    paths:
      - "pyo3/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-jfrog/**"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/pyo3-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyo3/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-jfrog/**"
      - ".github/actions/setup-public-package-proxies/**"
      - ".github/workflows/pyo3-checks.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: "PyO3 build + test (Python ${{ matrix.python-version }})"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    # `azure-prod` holds the Databricks secrets used by the live pytest suite.
    # This job only runs for trusted pushes and same-repository PRs; fork PRs
    # run the credential-free `fork-build-and-test` job instead.
    environment: azure-prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.TEST_PECO_WAREHOUSE_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      RUST_LOG: databricks_sql_kernel=info
      RUSTC_WRAPPER: sccache
      # Select sccache's GitHub Actions backend. Without this, the
      # protected runner's local cache disappears with the job.
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # Cover the supported floor through the newest release. 3.13
        # and 3.14 exercise the GIL / free-threading changes where
        # PyO3 extensions most often break. Floor is 3.9 — matches
        # `requires-python` in pyo3/pyproject.toml. (3.9 also resolves
        # the older `pyarrow>=14,<19` series via the env-marker split
        # in pyproject.toml, exercising that path in CI.)
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"
          uv: "true"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # pyo3 is a standalone workspace. The default "." mapping
          # cached the unused root target/ and root Cargo.lock while
          # every pyo3/target build remained cold.
          cache-workspaces: "pyo3 -> target"
          # PyO3 build-script output is interpreter-specific even though
          # the published extension uses abi3.
          cache-key: "py${{ matrix.python-version }}"

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # uv is the Python package manager the kernel pyo3 sub-crate
      # uses for env management. uv itself is installed via
      # astral-sh/setup-uv (SHA-pinned) rather than via
      # `pip install uv` so the bootstrap is also hash-locked.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin uv to a known good version; bump deliberately.
          version: "0.11.14"

      - name: Install dev dependencies (uv sync)
        # No `--frozen` and no committed lockfile: per go/pinning-
        # python-deps the externally-published-library rule says
        # *not* to pin transitive deps (it impedes downstream
        # `pip install`). The `[project].dependencies` major-version
        # bounds in `pyproject.toml` plus the JFrog proxy's 7-day
        # age filter on `db-pypi` are the baseline protection. uv
        # re-resolves each run within those bounds.
        working-directory: pyo3
        # `--no-install-project` installs only the dependency groups,
        # NOT the kernel cdylib itself. The later `uv run --no-sync`
        # calls preserve that choice: plain `uv run` would implicitly
        # sync and build the project before invoking maturin, compiling
        # the extension twice per matrix entry.
        run: uv sync --group dev --no-install-project

      - name: Cargo unit tests (pyo3 crate)
        # The pyo3 crate's Rust-side unit tests cover the GIL handoff
        # in isolation. Runs before any maturin build so a pure-Rust
        # break is caught fast.
        #
        # pyo3 is a standalone workspace (see `pyo3/Cargo.toml`), so
        # `cargo test` runs from inside `pyo3/` rather than via
        # `-p` from the kernel root. Same reason as napi: per-binding
        # TLS feature choice cannot share a workspace with the kernel
        # default.
        working-directory: pyo3
        run: cargo test

      - name: "Build + install pyo3 wheel (maturin develop)"
        working-directory: pyo3
        # `develop` builds the extension and installs it into the
        # uv-managed venv from the previous step. Debug build is
        # fine for tests and ~2x faster than --release.
        #
        # maturin's `develop` always targets the active virtualenv's
        # interpreter and (unlike `build`) has no --interpreter flag;
        # `uv run` activates the venv `uv sync` created for the matrix
        # Python version, so the interpreter is selected for us.
        # `--no-sync` is load-bearing: without it uv first installs the
        # project through its maturin build backend, then this command
        # asks maturin to build and install it a second time.
        run: uv run --no-sync maturin develop

      - name: pytest (no-network + live tiers)
        working-directory: pyo3
        # `conftest.py` decorates the warehouse-bound tests with
        # `@live`; they auto-skip when DATABRICKS_HOST/HTTP_PATH/
        # TOKEN are unset. With the env: block above the live tier
        # runs against the configured warehouse on PRs from this
        # repo. The separate `fork-build-and-test` job runs the
        # no-network tier without these secrets.
        # The extension and dependencies are already installed above;
        # avoid another implicit project sync before starting pytest.
        run: uv run --no-sync pytest -v

  # Keep the build sequence aligned with `build-and-test` above. This variant
  # intentionally substitutes the credential-free package proxies and omits
  # the azure-prod environment, its secrets, and the live-test tier.
  fork-build-and-test:
    name: "PyO3 build + test (Python ${{ matrix.python-version }})"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    env:
      RUST_LOG: databricks_sql_kernel=info
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-public-package-proxies
        with:
          cargo: "true"
          uv: "true"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-workspaces: "pyo3 -> target"
          cache-key: "fork-py${{ matrix.python-version }}"

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"

      - name: Install dev dependencies
        working-directory: pyo3
        run: uv sync --group dev --no-install-project

      - name: Cargo unit tests
        working-directory: pyo3
        run: cargo test

      - name: Build and install wheel
        working-directory: pyo3
        run: uv run --no-sync maturin develop

      - name: Run no-network tests
        working-directory: pyo3
        run: uv run --no-sync pytest -v
