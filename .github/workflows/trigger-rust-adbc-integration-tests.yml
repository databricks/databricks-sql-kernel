name: Trigger Rust ADBC Integration Tests

# Kernel-only changes intentionally skip this suite, matching Python/Node/Go.
# Full nightly ADBC coverage catches regressions from shared kernel changes.
# Advisory check; do not require it on ordinary, unlabeled PRs.
# Enable RUST_ADBC_INTEGRATION_TESTS_ENABLED after driver-test#1957 lands.
on:
  pull_request:
    types: [labeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}-${{ github.event.label.name || github.event_name }}
  # Finish the dispatch before a later run can reuse its pending check.
  cancel-in-progress: false

jobs:
  dispatch:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'integration-test' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Resolve test target
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('pr_number', pr.number);
            } else {
              const group = context.payload.merge_group;
              const match = /^refs\/heads\/gh-readonly-queue\/.+\/pr-(\d+)-[0-9a-f]+$/.exec(group.head_ref);
              if (!match) throw new Error(`Unexpected merge-group ref: ${group.head_ref}`);
              core.setOutput('base_sha', group.base_sha);
              core.setOutput('head_sha', group.head_sha);
              core.setOutput('pr_number', match[1]);
            }

      - name: Checkout changed revision
        if: vars.RUST_ADBC_INTEGRATION_TESTS_ENABLED == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Rust ADBC changes
        id: changed
        if: vars.RUST_ADBC_INTEGRATION_TESTS_ENABLED == 'true'
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            adbc/ .github/workflows/trigger-rust-adbc-integration-tests.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then exit "$diff_status"; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate integration App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.INTEGRATION_TEST_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TEST_PRIVATE_KEY }}
          owner: databricks
          repositories: |
            databricks-sql-kernel
            databricks-driver-test
          permission-contents: write
          permission-checks: write

      - name: Create Rust ADBC check
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          TESTS_ENABLED: ${{ vars.RUST_ADBC_INTEGRATION_TESTS_ENABLED }}
          ADBC_CHANGED: ${{ steps.changed.outputs.changed }}
          APP_ID: ${{ secrets.INTEGRATION_TEST_APP_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: process.env.HEAD_SHA,
              check_name: 'Rust ADBC Integration Tests',
              per_page: 100
            });
            const pending = checks.filter(check =>
              check.app?.id === Number(process.env.APP_ID) && check.status !== 'completed'
            );
            // Allow 120 minutes of tests plus an hour for queueing and reporting.
            const expiresBefore = Date.now() - 3 * 60 * 60 * 1000;
            const expired = check => {
              const started = Date.parse(check.started_at || check.created_at || '');
              return !Number.isFinite(started) || started <= expiresBefore;
            };
            for (const check of pending.filter(expired)) {
              await github.rest.checks.update({
                ...context.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: 'cancelled',
                completed_at: new Date().toISOString(),
                output: {
                  title: 'Previous Rust ADBC run expired',
                  summary: 'Superseded by a new request after three hours.'
                }
              });
            }
            const active = pending.find(check => !expired(check));
            if (active) {
              core.info(`Rust ADBC check ${active.id} is already pending for this commit.`);
              core.setOutput('dispatch', 'false');
              return active.id;
            }
            const enabled = process.env.TESTS_ENABLED === 'true';
            const runTests = enabled && process.env.ADBC_CHANGED === 'true';
            const timestamp = new Date().toISOString();
            const state = runTests ? {
              status: 'in_progress',
              started_at: timestamp
            } : {
              status: 'completed',
              conclusion: 'skipped',
              completed_at: timestamp,
              output: {
                title: 'Rust ADBC integration tests skipped',
                summary: enabled
                  ? 'No Rust ADBC driver or trigger workflow changes.'
                  : 'RUST_ADBC_INTEGRATION_TESTS_ENABLED is not true.'
              }
            };
            const { data: check } = await github.rest.checks.create({
              ...context.repo,
              name: 'Rust ADBC Integration Tests',
              head_sha: process.env.HEAD_SHA,
              ...state,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput('dispatch', String(runTests));
            return check.id;

      - name: Build Rust ADBC payload
        id: payload
        if: steps.check.outputs.dispatch == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CHECK_RUN_ID: ${{ steps.check.outputs.result }}
        with:
          script: |
            core.setOutput('json', JSON.stringify({
              commit_sha: process.env.HEAD_SHA,
              pr_number: process.env.PR_NUMBER,
              check_run_id: process.env.CHECK_RUN_ID
            }));

      - name: Dispatch Rust ADBC tests
        id: dispatch
        if: steps.check.outputs.dispatch == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: databricks/databricks-driver-test
          event-type: rust-adbc-pr-test
          client-payload: ${{ steps.payload.outputs.json }}

      - name: Report incomplete dispatch
        if: (failure() || cancelled()) && steps.check.outputs.dispatch == 'true' && steps.check.outputs.result != '' && steps.dispatch.outcome != 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECK_RUN_ID: ${{ steps.check.outputs.result }}
          CONCLUSION: ${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion: process.env.CONCLUSION,
              completed_at: new Date().toISOString(),
              output: {
                title: 'Rust ADBC dispatch incomplete',
                summary: `Rust ADBC integration dispatch ${process.env.CONCLUSION}. Check the sender workflow logs.`
              }
            });
