# Engineer Bot — learning (retrospective) extraction.
#
# On merge of a PR labelled `extract-learning`, the bot reads the merged PR's diff
# + review comments, decides whether there's a DURABLE, reusable engineering
# learning, and — if so — opens a PR appending an entry to this repo's learning log
# (.claude/knowledge/learning-log.md). Human-gated by design: it NEVER commits the
# canonical log directly; the entry lands as a reviewable PR.
#
# Self-contained job (NOT `uses: databricks/databricks-bot-engine/...`): an external
# repo can't resolve the internal engine's reusable workflows ("not found"). So the
# dogfood reusable's steps are inlined here: mint token → checkout default branch →
# gather PR context → setup-jfrog + Python + install-bot-engine → run retrospective.
#
# Opt-in is purely via the `retrospective:` block in .bot/config.yaml + this
# workflow; absent that block the engine phase is a clean no-op.
name: Engineer Bot — Learning

on:
  pull_request:
    types: [closed]

permissions:
  contents: write        # open the learning-log PR
  pull-requests: write
  id-token: write        # JFrog OIDC exchange for the engine/SDK/CLI install

jobs:
  learning:
    # Only on MERGE (not a plain close) of a PR carrying `extract-learning`, and
    # never on the learning bot's own PR (head ref ai/learning-pr-*) — that would
    # loop.
    if: >-
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'extract-learning')
      && !startsWith(github.event.pull_request.head.ref, 'ai/learning-pr-')
    environment: azure-prod   # DATABRICKS_HOST / DATABRICKS_TOKEN live here
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: engineer-bot-learning-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Mint engineer-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.ENGINEER_BOT_APP_ID }}
          private-key: ${{ secrets.ENGINEER_BOT_APP_PRIVATE_KEY }}

      - name: Checkout default branch (learning PR is cut from it)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure bot git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Derive the login from the App that actually minted the token, so the git
          # identity can't silently diverge from the credentials passed.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Gather merged-PR context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Write the gathered context into the checkout (the engine's repo_dir /
          # cwd) under the filenames the .bot/config.yaml `retrospective.context_files`
          # resolves against repo_dir (`pr_diff.txt`, `review_comments.txt`); the
          # engine inlines those into the prompt.
          { gh pr diff "$PR" --repo "$REPO" || true; } \
            | head -c 32000 > "$GITHUB_WORKSPACE/pr_diff.txt"
          { gh api --paginate "/repos/$REPO/pulls/$PR/comments" \
              --jq '.[] | "\(.path):\(.line // .original_line) \(.user.login): \(.body)"' || true; } \
            | head -c 32000 > "$GITHUB_WORKSPACE/review_comments.txt"

      # Route pip through the JFrog proxy for the engine install (no cargo — the
      # retrospective reads the diff, it doesn't build the crate). MUST run before
      # install-bot-engine (which reuses its PIP_INDEX_URL / JFROG_ACCESS_TOKEN).
      - name: Set up JFrog (pip)
        uses: ./.github/actions/setup-jfrog
        with:
          uv: "true"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'

      - name: Setup Node (for the Claude Code CLI the SDK spawns)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      # Mint the engine-scoped install token + install the engine. (We call
      # install-bot-engine directly rather than bot-prelude because this job's
      # this-repo token was already minted above with persist-credentials for the
      # checkout; bot-prelude would mint a second one and skip the git identity /
      # context-gather steps this flow needs.)
      - name: Mint engine-scoped install token
        id: engine-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.ENGINEER_BOT_APP_ID }}
          private-key: ${{ secrets.ENGINEER_BOT_APP_PRIVATE_KEY }}
          owner: databricks
          repositories: databricks-bot-engine
          permission-contents: read

      - name: Install engine + Claude SDK/CLI
        uses: ./.github/actions/install-bot-engine
        with:
          # Keep in lockstep with bot-prelude's engine-ref default (single source of
          # truth for the other bots; this flow can't read that default, so it is
          # pinned here — bump BOTH together).
          engine-ref: '5368de773858bef9b2a8bbf3099d08a4132a8487'
          engine-token: ${{ steps.engine-token.outputs.token }}

      - name: Extract learning + open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Only the `<workspace>/serving-endpoints/` prefix matters:
          # sdk_agent.translate_endpoint rewrites this to `.../serving-endpoints/anthropic`
          # and discards the model path segment. The effective model comes from
          # .bot/config.yaml `retrospective.model` (or the engine default).
          MODEL_ENDPOINT: https://${{ secrets.DATABRICKS_HOST }}/serving-endpoints/anthropic/invocations
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
        # retrospective.py resolves repo_dir from --repo-dir or cwd; this job's cwd
        # is $GITHUB_WORKSPACE (the checkout), where .bot/ + the gathered context
        # files live. Pass it explicitly so it never depends on an unset cwd.
        run: python -m databricks_bot_engine.engineer_bot.retrospective --repo-dir "$GITHUB_WORKSPACE"
