# After merge: trigger the multi-language coverage fan-out.
#
# Fires when a PR lands on main (merge queue or direct merge) and touched
# driver source. Dispatches `coverage-fanout` to databricks-driver-test, whose
# coverage-fanout-tracker.yml opens a tracking issue and runs the
# language-agnostic fan-out (a spec authored from THIS PR's diff, conformed as
# tests across every driver) as peco-engineer-bot.
#
# ------------------------------------------------------------------
# Why this lives in its OWN workflow file (not trigger-integration-tests.yml)
# ------------------------------------------------------------------
# This dispatch is fire-and-forget: no check is posted and there is no
# `if: failure()` fallback, so a cancellation silently drops the coverage
# fan-out. In its own workflow, no other PR event (e.g. a bot label
# landing during the token-mint + dispatch window) can cancel it, and its
# concurrency group below (keyed on the merge commit,
# `cancel-in-progress: false`) lets the dispatch always run to completion.
#
# ------------------------------------------------------------------
# Fork-merge assumption (why the fire-and-forget dispatch is safe here)
# ------------------------------------------------------------------
# This workflow assumes all merges into `main` originate from INTERNAL
# branches, never from forks. That assumption matters because the
# `pull_request` event withholds repository secrets from runs triggered by
# fork PRs (only a read-only `GITHUB_TOKEN` is passed). If a fork PR were
# merged while touching `src/`, `secrets.INTEGRATION_TEST_APP_ID` /
# `INTEGRATION_TEST_PRIVATE_KEY` would be empty, the token-mint step would
# fail, and — since the dispatch is fire-and-forget (no check, no
# `if: failure()`) — the coverage fan-out would be silently dropped. The
# kernel takes contributions on internal branches only, so this path is not
# exercised; the sibling adbc flow relies on the same internal-branch-only
# assumption. Revisit this if external/fork contributions are ever accepted.

name: Trigger Coverage Fanout

on:
  pull_request:
    types: [closed]

# Own concurrency group keyed on the merge commit with
# `cancel-in-progress: false` so the fire-and-forget dispatch always runs
# to completion. Because this is a standalone workflow, there is no shared
# workflow-level group that a stray same-PR-number event could cancel.
concurrency:
  group: coverage-fanout-${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  trigger-coverage-fanout:
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check if driver source changed
        id: changed
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // The whole repo IS the driver. Count a merge as source-affecting when it changes a file under src/.
            // Docs/CI/test-only merges do not warrant a full multi-language fan-out.
            const isSource = (f) => f.startsWith('src/');
            const srcChanged = files.some((f) => isSource(f.filename));
            console.log(`driver source changed: ${srcChanged}`);
            core.setOutput('source', srcChanged.toString());

      - name: Generate GitHub App token (databricks-driver-test)
        if: steps.changed.outputs.source == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.INTEGRATION_TEST_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TEST_PRIVATE_KEY }}
          owner: databricks
          repositories: databricks-driver-test
          permission-contents: write

      - name: Dispatch coverage-fanout
        if: steps.changed.outputs.source == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: databricks/databricks-driver-test
          event-type: coverage-fanout
          client-payload: '{"reference_repo": "${{ github.repository }}", "pr_number": "${{ github.event.pull_request.number }}", "pr_url": "${{ github.event.pull_request.html_url }}"}'
