# Enforces the dependency-licence allowlist in `deny.toml`. New
# transitive dependencies with licenses outside `[licenses].allow`
# fail the build; the contributor either adds the licence (with
# justification in the PR description) or swaps the dep.
#
# Uses `cargo-deny` (the standard Rust ecosystem tool for this) —
# `cargo-about` is for generating attribution pages, not for gating
# on an allowlist. `about.toml` is preserved for when an attribution
# page is needed; CI gates on `deny.toml`.

name: License Check

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      # napi/ is a standalone workspace with its own lockfile; its
      # dependency graph is invisible to a root `cargo deny` run, so
      # changes there must re-trigger this workflow to scan it.
      - "napi/Cargo.toml"
      - "napi/Cargo.lock"
      - ".github/workflows/license-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "napi/Cargo.toml"
      - "napi/Cargo.lock"
      - ".github/workflows/license-check.yml"

permissions:
  contents: read
  # Required for the OIDC token exchange that the
  # `.github/actions/setup-jfrog` composite uses. See go/hardened-gha.
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  cargo-deny:
    name: License & advisory check
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/setup-jfrog
        with:
          cargo: "true"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145  # v2.83.1
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, bans, sources (root workspace)
        # `licenses` is the load-bearing check; `advisories` flags
        # RustSec security advisories; `bans` and `sources` are
        # empty-permissive in our deny.toml today but the slots are
        # there for future hardening. The root workspace covers the
        # kernel + pyo3 (pyo3 is a root workspace member).
        run: cargo deny check

      - name: Check licenses, advisories, bans, sources (napi workspace)
        # napi/ is a separate Cargo workspace (its own Cargo.lock) so
        # its transitive graph is NOT seen by the root run above. Scan
        # it explicitly against the same deny.toml policy. `--config`
        # points back at the root deny.toml so both workspaces share
        # one allowlist rather than drifting. Both `--manifest-path` and
        # `--config` are GLOBAL cargo-deny flags (before the `check`
        # subcommand): cargo-deny 0.20 (PR EmbarkStudios/cargo-deny#881)
        # moved `--config` from a `check` flag to the root, so the old
        # `check --config …` form now errors with "unexpected argument
        # '--config'". Both paths are absolute via $GITHUB_WORKSPACE so the
        # step is immune to any `defaults.run.working-directory` a future
        # edit might add (a relative `--config` would otherwise resolve
        # against the manifest dir and look for napi/deny.toml).
        run: cargo deny --manifest-path "$GITHUB_WORKSPACE/napi/Cargo.toml" --config "$GITHUB_WORKSPACE/deny.toml" check
