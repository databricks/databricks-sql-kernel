# Enforces the dependency-licence allowlist in `deny.toml`. New
# transitive dependencies with licenses outside `[licenses].allow`
# fail the build; the contributor either adds the licence (with
# justification in the PR description) or swaps the dep.
#
# Uses `cargo-deny` (the standard Rust ecosystem tool for this) —
# `cargo-about` is for generating attribution pages, not for gating
# on an allowlist. `about.toml` is preserved for when an attribution
# page is needed; CI gates on `deny.toml`.

name: License Check

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/license-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/license-check.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@a416ddeedbd372e614cc1386e8b642692f66865e  # v2.57.1
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, bans, sources
        # `licenses` is the load-bearing check; `advisories` flags
        # RustSec security advisories; `bans` and `sources` are
        # empty-permissive in our deny.toml today but the slots are
        # there for future hardening.
        run: cargo deny check
