name: Set up public package proxies
description: Configure unauthenticated Databricks-filtered Cargo and Python package proxies.

inputs:
  cargo:
    description: Configure Cargo to use the public Databricks crates proxy.
    required: false
    default: "false"
  uv:
    description: Configure uv and pip to use the public Databricks PyPI proxy.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure Cargo package proxy
      if: inputs.cargo == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml <<'EOF'
        [source.crates-io]
        replace-with = "databricks-proxy"

        [source.databricks-proxy]
        registry = "sparse+https://crates-proxy.cloud.databricks.com/"

        [http]
        timeout = 120

        [net]
        git-fetch-with-cli = true
        retry = 5
        EOF

    - name: Configure Python package proxy
      if: inputs.uv == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "UV_INDEX_URL=https://pypi-proxy.cloud.databricks.com/simple/" >> "$GITHUB_ENV"
        echo "PIP_INDEX_URL=https://pypi-proxy.cloud.databricks.com/simple/" >> "$GITHUB_ENV"
