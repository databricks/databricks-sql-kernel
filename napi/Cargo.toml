# Standalone workspace.
#
# This crate is intentionally NOT a member of the kernel workspace at
# `../Cargo.toml`. The reason is Cargo feature unification: pyo3 (a
# kernel-workspace member) builds the kernel with the default
# `tls-native` feature; this crate builds it with `tls-rustls`. If both
# lived in the same workspace, `cargo build --workspace` would unify
# the kernel's feature set to `tls-native ∪ tls-rustls`, link both TLS
# stacks into the resulting napi cdylib, and reintroduce the OpenSSL ↔
# Node symbol clash the rustls switch was meant to avoid.
#
# Building this crate is therefore done from `napi/` (not from the
# kernel root with `--workspace`). The kernel is reached via `path =
# ".."` — the same source tree, just a different workspace view.
#
# Side benefit: `[profile.release]` below is now honored. Profile
# sections in non-root workspace members are silently ignored by Cargo;
# making this crate its own workspace root activates them.
[workspace]
members = ["."]

[package]
name = "databricks-sql-kernel-napi"
version = "1.0.0"
edition = "2021"
authors = ["Databricks"]
license = "Apache-2.0"
description = "Databricks SQL Kernel — Node.js native binding (napi-rs)"
publish = false

[lib]
# `rlib` alongside `cdylib` so `cargo test -p databricks-sql-kernel-napi`
# can pick up `#[cfg(test)]` modules in src/**. With only `cdylib`,
# cargo silently reports "running 0 tests / ok" even when `#[test]`
# functions exist — a real footgun for any later Rust-side test.
# Mirrors the equivalent decision in `pyo3/Cargo.toml`.
crate-type = ["cdylib", "rlib"]

[features]
# Resolve N-API symbols at runtime via libloading (with no-op stubs when
# the host doesn't export them) instead of at link time. Enabled only for
# `cargo test`: napi-rs 3's `napi::error` references N-API symbols
# (`napi_reference_unref`, …) from a `Drop` impl unconditionally, so the
# `lib test` executable — which has no Node host — fails to link (and,
# with undefined-symbol linking, crashes on load). `dyn-symbols` makes
# those calls fall back to stubs, so the pure-logic Rust unit tests
# (error envelope, params codec, panic recovery) run hostless. The
# release cdylib deliberately does NOT enable this: loaded inside Node,
# it wants the real link-time symbols.
dyn-symbols = ["napi/dyn-symbols"]

[dependencies]
# napi-rs v3 line; `napi6` enables N-API 6 surface, `async` enables the
# `#[napi] async fn` glue that drives futures on napi-rs's tokio runtime.
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"

# Kernel — path dep on the async-public-api branch worktree. Once the
# kernel is published this becomes a version dep.
#
# We disable the kernel's `default` feature (which selects `tls-native`)
# and opt into `tls-rustls` instead. This avoids the OpenSSL-symbol clash
# between `native-tls` (system OpenSSL 1.1 on Linux) and Node.js (statically
# linked OpenSSL 3.x): loading a napi module that pulls in OpenSSL 1.1
# symbols into a Node process segfaults before any Rust code runs. The
# pure-Rust rustls backend has no such conflict.
#
# Direct-Rust users + the C-ABI (future ODBC) keep `tls-native` via the
# kernel's default feature.
databricks-sql-kernel = { path = "..", default-features = false, features = ["tls-rustls"] }

# Tracing — transitive via the kernel; declared explicitly so the napi layer
# can emit its own `tracing::debug!` breadcrumbs (metadata blocking-pool
# entry/exit, metadata-cancel no-op) through the same subscriber the kernel uses.
tracing = "0.1"

# `tracing-subscriber` — the napi layer installs a process-global Subscriber
# (see `logger.rs`) that captures kernel `tracing` events and forwards them to
# the JS `DBSQLLogger` via a `ThreadsafeFunction`. Only `registry` + `std` are
# needed; level filtering is done by our own atomic rather than `EnvFilter`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# Tokio is a transitive dep via the kernel and via napi's `async` feature;
# declared explicitly so we can name `tokio::runtime::Handle` and
# `tokio::sync::Mutex` directly.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

# Lazy `OnceCell` for the captured tokio Handle.
once_cell = "1"

# `catch_unwind` wrapper around async futures (pattern #8 of the
# napi-rs patterns doc). Transitively a dep of the kernel already, but
# declared here so we can `use FutureExt;` directly.
futures = { version = "0.3", default-features = false, features = ["std"] }

# Arrow IPC encoding of result batches across the napi boundary.
# `arrow-array` / `arrow-schema` come in via the kernel's public types
# (`RecordBatch`, `SchemaRef`); `arrow-ipc` is for the `StreamWriter`
# we use on the encode side. Versions kept in lock-step with the
# kernel's `arrow-*` deps to avoid two arrow versions in the dep graph.
arrow-array = "59"
arrow-schema = "59"
arrow-ipc = "59"

# Error envelope serialization. Already a kernel transitive dep; the
# direct declaration is so we can use `serde_json::json!` in
# `src/error.rs` without bouncing through a hand-rolled escaper.
serde_json = "1"

# Date/time parsing for the params codec. Already a kernel transitive
# dep (the kernel's `TypedValue::Date`/`Timestamp{,Ntz,Ltz}` variants
# wrap `chrono` types directly); declared here so `params.rs` can name
# `NaiveDate` / `NaiveDateTime` / `DateTime<Utc>` for literal parsing.
# Version kept in lock-step with the kernel's `chrono` dep.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
napi-build = "2"  # napi-build stays on 2.x; napi-rs 3 build script is compatible

[profile.release]
lto = true
# Single codegen unit for the cdylib: ~30-60s slower build for
# meaningfully smaller binary + better cross-crate inlining. Mirrors
# the standard napi-rs release-profile recipe.
codegen-units = 1
# `panic = "abort"` MUST NOT be added here. The crate relies on
# `util::guarded`'s `catch_unwind` to convert futures-panics into
# `napi::Error` rejected promises (pattern #8 in the napi-rs patterns
# doc). With `panic = "abort"`, `catch_unwind` becomes a no-op and the
# Node process exits instead — turning a recoverable per-statement
# panic into a fleet-wide outage. The 5 `util::guarded_recovers_*`
# tests cover this contract; if any future optimisation flips this
# flag the test binary itself will abort under panic before reporting.
# `strip = "debuginfo"` (not `"symbols"`) — keeps function-name symbols
# so production stack traces from `panic_payload_msg` (and any future
# native crash dump) are readable. Stripping `debuginfo` only drops the
# DWARF/PDB debug sections, which costs ~no binary size on cdylibs but
# preserves the symbol table that's needed to make a numeric backtrace
# useful in incident triage. If you need a smaller artifact, strip
# `"symbols"` in CI and archive an unstripped `.node` for symbolication.
strip = "debuginfo"
