[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "databricks-sql-kernel"
version = "0.2.1"
description = "Python bindings for the Databricks SQL Kernel (PyO3)"
# Floor matches the tested CI matrix in
# .github/workflows/pyo3-checks.yml (3.9 .. 3.14). The abi3-py39
# wheel (see pyo3/Cargo.toml) loads on every CPython at or above
# this floor from a single artifact.
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Databricks" }]
# Runtime dependency for downstream consumers. Major-version bound
# per the go/pinning-python-deps externally-published-library rule:
# exact pins make this wheel harder for end-users to install
# alongside their own pyarrow consumers. The CI environment also
# uses these bounds (no committed lockfile) — see the
# `[dependency-groups].dev` block below + the workflow comment in
# `.github/workflows/pyo3-checks.yml` for the policy rationale.
#
# Split by interpreter via PEP 508 environment markers because the
# two ends of the supported range need different pyarrow floors:
#
#  * Python 3.10+: `>=23.0.1` matches databricks-sql-connector 5.0.0
#    (databricks/databricks-sql-python#818). pyarrow only ships cp314
#    (Python 3.14) wheels from 23.x onward, so an older ceiling forces
#    a from-source build that fails on 3.14. Keeping the floor aligned
#    with the connector also keeps the two surfaces installable side
#    by side.
#  * Python 3.9: pyarrow 23.x dropped 3.9 wheels, so 3.9 takes the
#    last series that still ships them (`>=14,<19`). 3.9 never sees
#    3.14, so the cp314 concern does not apply here.
#
# Both `<24` / `<19` ceilings preserve the major-version upper bound
# the go/pinning-python-deps policy requires (a future pyarrow major
# then surfaces as a deliberate bump, not a silent auto-resolve).
dependencies = [
    "pyarrow>=23.0.1,<24; python_version >= '3.10'",
    "pyarrow>=14,<19; python_version < '3.10'",
]

# Dev / CI dependencies. PEP 735 standard; uv reads this directly.
# CI runs `uv sync --group dev` (no `--frozen`, no committed
# lockfile) per the externally-published-library policy in
# go/pinning-python-deps. The major-version upper bounds below
# plus the `db-pypi` JFrog proxy's 7-day age filter are the
# baseline supply-chain protection; uv re-resolves on each CI run
# within those bounds.
[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8.3,<9.0",
]

[tool.maturin]
module-name = "databricks_sql_kernel"
features = ["extension-module"]
