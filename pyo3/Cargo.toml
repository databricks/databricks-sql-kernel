# Standalone workspace.
#
# This crate is intentionally NOT a member of the kernel workspace at
# `../Cargo.toml`. The reason is Cargo feature unification: this crate
# builds the kernel with `tls-rustls`; the kernel itself (and any
# C-ABI consumer) builds with the default `tls-native`. If both lived
# in the same workspace, `cargo build --workspace` would unify the
# kernel's feature set to `tls-native ∪ tls-rustls`, trip the
# mutual-exclusion `compile_error!` in `src/lib.rs`, and (if that
# guard were removed) link both TLS stacks into the resulting cdylib.
#
# Building this crate is therefore done from `pyo3/` (not from the
# kernel root with `--workspace`). The kernel is reached via `path =
# ".."` — same source tree, different workspace view. Mirrors the
# napi crate's setup at `../napi/Cargo.toml`.
[workspace]
members = ["."]

[package]
name = "databricks-sql-kernel-pyo3"
version = "0.2.1"
edition = "2021"
authors = ["Databricks"]
license = "Apache-2.0"
description = "PyO3 Python bindings for the Databricks SQL Kernel"
repository = "https://github.com/databricks/databricks-sql-kernel"

# Built as a Python extension module by maturin. The lib basename here
# only affects the intermediate `.so` cargo produces; maturin renames
# the wheel artifact to `databricks_sql_kernel.<abi>.so` per
# `module-name` in pyproject.toml, and pyo3 derives the `PyInit_*`
# symbol from the `#[pymodule]` function name (not this `[lib].name`).
# Picking a distinct name avoids colliding with the kernel root crate's
# own cdylib output.
#
# `rlib` is included so `cargo test -p databricks-sql-kernel-pyo3`
# can pick up future `#[cfg(test)]` modules in `src/**`. With only
# `cdylib`, cargo silently reports "running 0 tests / ok" even if a
# `#[test]` exists — a real footgun for any later Rust-side test.
[lib]
name = "databricks_sql_kernel_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Disable the kernel's `default` feature (which selects `tls-native`)
# and opt into `tls-rustls` instead — same as the napi crate. The
# wheel is built inside a manylinux container that ships no OpenSSL,
# so `native-tls` (system OpenSSL via `openssl-sys`) fails to compile;
# the pure-Rust rustls backend needs no system library and keeps the
# published wheel self-contained / portable.
#
# Direct-Rust users + the C-ABI (future ODBC) keep `tls-native` via the
# kernel's default feature.
databricks-sql-kernel = { path = "..", default-features = false, features = ["tls-rustls"] }

# pyo3 — abi3-py39 builds a single stable-ABI wheel (tagged
# cp39-abi3) that loads on CPython 3.9+. The ABI floor is kept in
# step with `requires-python = ">=3.9"` in pyproject.toml; bumping
# both together avoids shipping a wheel whose ABI tag advertises an
# interpreter the package no longer claims to support.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# Multi-thread runtime — one per Session, owned on the Rust side.
tokio = { version = "1", features = ["rt-multi-thread"] }

# Arrow handoff. Pinned to 59 to match the kernel's arrow-* deps so we
# share the same RecordBatch / Schema types and never have to convert.
arrow-array = "59"
arrow-schema = "59"
arrow-pyarrow = "59"

# Date / timestamp parsing for parameter binding. Same version the
# kernel uses for its `TypedValue::Date` / `TypedValue::Timestamp`
# variants — the parsed values flow directly into those.
chrono = "0.4"
pyo3-log = "0.13"
log = "0.4"
tracing = "0.1"
