# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/.
# Enforced by .github/workflows/license-check.yml.

[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = []

[licenses]
# Permissive licenses we allow in transitive deps. Adding a new
# entry requires PR-description justification.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Confidence threshold for license-text matching. 0.8 is the
# cargo-deny default; 0.93 reduces false positives for crates with
# slightly non-standard licence text.
confidence-threshold = 0.93

[bans]
# Tighten over time. Today we just want license enforcement live.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
