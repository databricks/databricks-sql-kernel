# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/.
# Enforced by .github/workflows/license-check.yml.

[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": RSA timing sidechannel in the
    # `rsa` crate. No fixed version exists (only 0.10 release candidates;
    # stable 0.9.x is still affected), so it cannot be cleared by a bump.
    #
    # `rsa` is a DEV-ONLY dependency here: it generates RSA test keys
    # in-process for the JWT auth unit tests (`src/auth/oauth/test_keys.rs`)
    # so we don't commit PEM fixtures (secret scanner) or shell out to
    # `openssl` (not on Windows). Verified dev-only via `cargo tree -i rsa`
    # — it is never linked into the shipped kernel, pyo3, or napi artifacts,
    # so the timing sidechannel is not reachable by any driver consumer.
    # The runtime signing path uses `jsonwebtoken` (ring), not `rsa`.
    #
    # We keep `rsa` (rather than dropping RSA test coverage for EC-only)
    # because RS256 is the JDBC default and the most common real-world key
    # type, so exercising the RSA load+sign path in tests has value.
    # Re-evaluate when `rsa` ships a constant-time stable release.
    "RUSTSEC-2023-0071",
    # The empty-DATA-frame flood affects HTTP/2 servers; the kernel only
    # uses HTTP/2 as a client and runs no h2 server.
    "RUSTSEC-2026-0258",
]

[licenses]
# Permissive licenses we allow in transitive deps. Adding a new
# entry requires PR-description justification.
allow = [
    "Apache-2.0",
    # target-lexicon, used by PyO3's build configuration.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # CC0-1.0 is a public-domain dedication (no attribution or
    # copyleft obligation). Pulled in transitively by `tiny-keccak`
    # (v2.0.2) — present in BOTH the root graph (ahash -> const-random
    # -> const-random-macro -> tiny-keccak) and the napi graph. The
    # root `cargo deny` run was previously passing without this entry
    # only because the license text was classified as "unknown" under
    # confidence-threshold = 0.93 rather than matched to the explicit
    # CC0-1.0 string; allow-listing it makes the policy explicit so a
    # future classifier change can't silently flip it to a hard reject.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Confidence threshold for license-text matching. 0.8 is the
# cargo-deny default; 0.93 reduces false positives for crates with
# slightly non-standard licence text.
confidence-threshold = 0.93

[bans]
# Tighten over time. Today we just want license enforcement live.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
