# `kernel_error::Error` is the typed kernel error and is intentionally
# rich (sql_state, error_code, vendor_code, http_status, retryable,
# query_id, location, cause chain). The default 128-byte threshold
# would force Box<Error> wrappers across the codebase, which would
# break the pattern-matching contract documented on `Error` (wrappers
# need `let Error { code, message, sql_state, .. } = err;`).
#
# 256 bytes is a generous ceiling that fits the current ~144-byte
# layout plus headroom for future fields without forcing churn.
large-error-threshold = 256
